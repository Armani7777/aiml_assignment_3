services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ "ollama:/root/.ollama" ]
    ports: [ "11434:11434" ]
  app:
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
      RA_MODEL: qwen2.5:3b
    ports: [ "8501:8501" ]
    depends_on: [ ollama ]
# Первый запуск модели: docker compose exec ollama ollama pull qwen2.5:3b
volumes:
  ollama: {}
